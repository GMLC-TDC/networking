version: 2
aliases:
  - &run_networking
    name: run_networking
    environment:
    command: |
      mkdir -p build
      cd build
      eval cmake .. ${CMAKE_FLAGS}
      make -j 4
      ctest --verbose

jobs:
  networkingTSan:
    docker:
      - image: helics/buildenv:sanitizers-19
    environment:
      CMAKE_FLAGS: '-DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang -DGMLC_NETWORKING_ENABLE_ENCRYPTION=OFF -DCMAKE_CXX_FLAGS="-fsanitize=thread -nostdinc++ -nostdlib++ -L/root/develop/libcxx_tsan/lib -lc++ -lc++abi -isystem /root/develop/libcxx_tsan/include -isystem /root/develop/libcxx_tsan/include/c++/v1 -Wno-unused-command-line-argument -Wno-reserved-identifier -Wno-reserved-macro-identifier -fno-omit-frame-pointer -g -O1 -Wl,-rpath,/root/develop/libcxx_tsan/lib"'
      TSAN_OPTIONS: "second_deadlock_stack=1"

    steps:
      - checkout
      - run: *run_networking

  networkingASan:
    docker:
      - image: helics/buildenv:sanitizers-19
    environment:
      CMAKE_FLAGS: '-DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang -DGMLC_NETWORKING_ENABLE_ENCRYPTION=OFF -DCMAKE_CXX_FLAGS="-fsanitize=undefined,address -lc++ -lc++abi -fsanitize-address-use-after-scope -fsanitize-ignorelist=$PWD/../config/asan_suppression.txt -Wno-unused-command-line-argument -Wno-reserved-identifier -Wno-reserved-macro-identifier -fno-omit-frame-pointer -g -O1 -fsanitize-blacklist=$PWD/../.circleci/asan_blacklist.txt"'
      LSAN_OPTIONS: "suppressions=/root/project/.circleci/leak_suppression.txt"
      UBSAN_OPTIONS: "print_stacktrace=1"

    steps:
      - checkout
      - run: *run_networking

  networkingMSan:
    docker:
      - image: helics/buildenv:sanitizers-19
    environment:
      CMAKE_FLAGS: '-DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang -DGMLC_NETWORKING_ENABLE_ENCRYPTION=OFF -DCMAKE_CXX_FLAGS="-fsanitize=memory -nostdinc++ -nostdlib++ -L/root/develop/libcxx_msan/lib -lc++ -lc++abi -isystem /root/develop/libcxx_msan/include -isystem /root/develop/libcxx_msan/include/c++/v1 -Wno-unused-command-line-argument -Wno-reserved-identifier -Wno-reserved-macro-identifier -fno-omit-frame-pointer -g -O1 -Wl,-rpath=/root/develop/libcxx_msan/lib"'

    steps:
      - checkout
      - run: *run_networking

workflows:
  version: 2
  networking_test:
    jobs:
      - networkingMSan
      - networkingASan
      - networkingTSan
