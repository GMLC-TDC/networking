name: Static Analyzers

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  cpplint:
    runs-on: ubuntu-latest
    container: helics/buildenv:cpplint

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Run cpplint
        run: cpplint --counting=detailed --recursive gmlc tests
  cppcheck:
    runs-on: ubuntu-latest
    container: helics/buildenv:cppcheck2

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Run cppcheck
        run: cppcheck --enable=performance,portability --check-level=exhaustive --language=c++ --suppressions-list=config/cppcheck_suppressions.txt --error-exitcode=-4 -i ThirdParty -i docs -i config .
