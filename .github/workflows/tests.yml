name: Tests
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            std: 20
          - os: windows-latest
            std: 20
          - os: macos-latest
            std: 23
          - os: ubuntu-24.04-arm
            std: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        run: choco install openssl

      - name: CMake Configure
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            if [[ -d /opt/homebrew/opt/openssl@3 ]]; then
              export OPENSSL_ROOT_DIR=/opt/homebrew/opt/openssl@3
            elif [[ -d /usr/local/opt/openssl@3 ]]; then
              export OPENSSL_ROOT_DIR=/usr/local/opt/openssl@3
            fi
          fi
          cmake -B build -S . \
            -DCMAKE_CXX_STANDARD=${{ matrix.std }} \
            -DGMLC_NETWORKING_ENABLE_ENCRYPTION=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

  catch2-3:
    name: External Catch2 3.x
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Catch2
        run: brew install catch2

      - name: CMake Configure
        shell: bash
        run: |
          CATCH2_PREFIX="$(brew --prefix catch2)"
          cmake -B build -S . \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_PREFIX_PATH="${CATCH2_PREFIX}" \
            -DGMLC_NETWORKING_ENABLE_ENCRYPTION=OFF

      - name: Build
        run: cmake --build build --parallel 4

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

  gcc-15:
    name: GCC 15
    runs-on: ubuntu-latest
    container:
      image: gcc:15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install build tools
        run: apt-get update && apt-get install -y cmake ninja-build

      - name: CMake Configure
        run: >
          cmake -G Ninja -B build -S .
          -DCMAKE_CXX_STANDARD=20
          -DGMLC_NETWORKING_ENABLE_ENCRYPTION=OFF

      - name: Build
        run: cmake --build build --parallel 4

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

  clang-22:
    name: Clang 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Clang 22
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release software-properties-common
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y clang-22 lld-22 ninja-build

      - name: CMake Configure
        run: >
          cmake -G Ninja -B build -S .
          -DCMAKE_C_COMPILER=clang-22
          -DCMAKE_CXX_COMPILER=clang++-22
          -DCMAKE_CXX_FLAGS=-Wdocumentation
          -DCMAKE_CXX_STANDARD=20
          -DGMLC_NETWORKING_ENABLE_ENCRYPTION=OFF

      - name: Build
        run: cmake --build build --parallel 4

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure


  # Test running CMake configure step with a variety of CMake versions
  cmake-config:
    name: CMake config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: CMake 3.22
        uses: ./.github/actions/quick_cmake
        with:
          cmake-version: 3.22.0
          args: -DGMLC_NETWORKING_ENABLE_ENCRYPTION=OFF
      - name: CMake 3.23
        uses: ./.github/actions/quick_cmake
        with:
          cmake-version: 3.23.0
          args: -DGMLC_NETWORKING_ENABLE_ENCRYPTION=OFF
        if: success() || failure()
      - name: CMake 3.24
        uses: ./.github/actions/quick_cmake
        with:
          cmake-version: 3.24.0
          args: -DGMLC_NETWORKING_ENABLE_ENCRYPTION=OFF
        if: success() || failure()
      - name: CMake 3.25
        uses: ./.github/actions/quick_cmake
        with:
          cmake-version: 3.25.0
          args: -DGMLC_NETWORKING_ENABLE_ENCRYPTION=OFF
        if: success() || failure()
      - name: CMake 3.26
        uses: ./.github/actions/quick_cmake
        with:
          cmake-version: 3.26.0
          args: -DGMLC_NETWORKING_ENABLE_ENCRYPTION=OFF
        if: success() || failure()
      - name: CMake 3.27
        uses: ./.github/actions/quick_cmake
        with:
          cmake-version: 3.27.0
          args: -DGMLC_NETWORKING_ENABLE_ENCRYPTION=OFF
        if: success() || failure()
      - name: CMake 3.28
        uses: ./.github/actions/quick_cmake
        with:
          cmake-version: 3.28.0
          args: -DGMLC_NETWORKING_ENABLE_ENCRYPTION=OFF
        if: success() || failure()
      - name: CMake 3.29
        uses: ./.github/actions/quick_cmake
        with:
          cmake-version: 3.29.0
          args: -DGMLC_NETWORKING_ENABLE_ENCRYPTION=OFF
        if: success() || failure()
      - name: CMake 3.30
        uses: ./.github/actions/quick_cmake
        with:
          cmake-version: 3.30.0
          args: -DGMLC_NETWORKING_ENABLE_ENCRYPTION=OFF
        if: success() || failure()
      - name: CMake 3.31
        uses: ./.github/actions/quick_cmake
        with:
          cmake-version: 3.31.0
          args: -DGMLC_NETWORKING_ENABLE_ENCRYPTION=OFF
        if: success() || failure()
      - name: CMake 4.0
        uses: ./.github/actions/quick_cmake
        with:
          cmake-version: 4.0.0
          args: -DGMLC_NETWORKING_ENABLE_ENCRYPTION=OFF
        if: success() || failure()
      - name: CMake 4.1
        uses: ./.github/actions/quick_cmake
        with:
          cmake-version: 4.1.0
          args: -DGMLC_NETWORKING_ENABLE_ENCRYPTION=OFF
        if: success() || failure()
      - name: CMake 4.2
        uses: ./.github/actions/quick_cmake
        with:
          cmake-version: 4.2.0
          args: -DGMLC_NETWORKING_ENABLE_ENCRYPTION=OFF
        if: success() || failure()
