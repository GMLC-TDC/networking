name: FreeBSD

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "freebsd/**"
      - "freebsd-**"
  pull_request:
    branches:
      - main

jobs:
  freebsd:
    name: FreeBSD 14.3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Build and test
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          prepare: |
            pkg install -y cmake ninja git
          run: |
            cmake -GNinja -B build -S .
            cmake --build build --parallel
            ctest --test-dir build --output-on-failure
